const clone=x=>JSON.parse(JSON.stringify(x));let model=clone(DEFAULT);try{const saved=localStorage.getItem('rankshow-tv-v1');if(saved)model=validate(JSON.parse(saved))}catch{}let ranks=[],timers=[],epoch=0,sound=false,ctx=null;

for(let i=0;i<18;i++){let el=document.createElement('i');let size=28+Math.random()*112;el.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--dur:${4+Math.random()*8}s;--dx:${Math.random()*110-55}px;--dy:${Math.random()*130-65}px;opacity:${.2+Math.random()*.65}`;$('bokeh').append(el)}

function resize(){const v=$('viewport');stage.style.setProperty('--scale',Math.min(v.clientWidth/1500,v.clientHeight/843.75))}new ResizeObserver(resize).observe($('viewport'));resize();
function clear(){stop();ranks.forEach(r=>{r.className='rank';r.style.animationDelay=''});$('medal').classList.remove('show');$('spark').replaceChildren()}

function auto(){clear();for(let i=9;i>=0;i--)later(()=>{show(i,i===0);if(i===1)ranks[1].classList.remove('runner')},500+(9-i)*135);later(()=>{ranks[1].classList.add('blink','runner');tone('drum')},2600);later(()=>{ranks[1].classList.remove('blink');winner()},5200)}
